name = "constitutional_frontend_client_engineer"
description = "Project-local engineer for the constitutional RAG client surface: React 19/Vite frontend, Zustand query state, SSE behavior, document UI, and Electron shell."
model = "gpt-5.5"
model_reasoning_effort = "high"
