services:
  # ═══════════════════════════════════════════════════════════════════
  # ChromaDB — Vector Database
  # ═══════════════════════════════════════════════════════════════════
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # Backend — FastAPI RAG Pipeline
  # ═══════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${CONST_PORT:-8900}:8900"
    env_file:
      - ./backend/.env
    environment:
      - CONST_HOST=0.0.0.0
      - CONST_PORT=8900
      - CONST_LLM_BASE_URL=http://host.docker.internal:11434
      - CONST_SVENSK_RAGG_MODEL=gemma4:e2b
      - CONST_SVENSK_RAGG_FALLBACK=gemma4:e2b
      - CONST_GGUF_PRIMARY_MODEL=gemma4:e2b
      - CONST_CRAG_GRADER_MODEL=gemma4:e2b
      - CONST_CHROMADB_PATH=/data/chromadb
      - CONST_LOG_JSON=true
    volumes:
      - chromadb_data:/data/chromadb:ro
      - pdf_cache:/data/pdf_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8900/api/svensk-ragg/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  chromadb_data:
    driver: local
  pdf_cache:
    driver: local
